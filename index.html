<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dukan Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f3b;--paper:#fff8ec;--gold:#f2a900;--teal:#0e7c7b;--chili:#d1344b;--sky:#3a7bd5;--card:#fff;--line:#eadfc8;--btn:#1b1f3b}
*{box-sizing:border-box;margin:0}
body{font-family:"Trebuchet MS",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
#app{max-width:480px;margin:auto;min-height:100vh;position:relative}
.screen{display:none;padding:18px 16px 90px;min-height:100vh;flex-direction:column;gap:12px}
.screen.on{display:flex}
h1{font-size:2rem;line-height:1.15}h2{font-size:1.3rem}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--btn);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
.pill{border-radius:30px;background:var(--card);color:var(--ink);border:2px solid var(--ink);font-size:1.1rem;padding:14px}
.pill.gold{background:var(--gold);border-color:var(--gold)}
.sm{padding:6px 12px;font-size:.85rem}
.top{display:flex;align-items:center;gap:10px}.top h2{flex:1}
.back{background:var(--line);color:var(--ink);padding:8px 12px}
input,select{font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);width:100%}
.row{display:flex;gap:8px;align-items:center}
.safe{margin-top:auto;text-align:center;color:var(--teal);font-weight:bold}
.err{color:var(--chili);min-height:1.2em}
#langs{list-style:none;padding:0}#langs li{padding:14px 6px;border-bottom:1px solid var(--line);cursor:pointer}
#langs li.cur{color:var(--teal);font-weight:bold}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:14px;color:#fff}.stat b{display:block;font-size:1.5rem}
.s1{background:var(--sky)}.s2{background:var(--teal)}
.tiles{display:grid;gap:10px}
.tile{padding:20px;font-size:1.15rem;text-align:left;color:#fff}
.t1{background:var(--sky)}.t2{background:var(--teal)}.t3{background:var(--chili)}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 16px;background:var(--card);border-top:2px solid var(--line);display:flex;gap:8px}
.bar .pill{flex:1;text-align:left;font-size:1rem;color:#777}
.chat{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto}
.msg{padding:10px 14px;border-radius:14px;max-width:85%}
.me{background:var(--gold);align-self:flex-end}.bot{background:var(--card);border:1px solid var(--line)}
.inrow{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 16px;background:var(--card);display:flex;gap:8px;border-top:2px solid var(--line)}
.tabs{display:flex;gap:6px}.tabs button{flex:1;background:var(--line);color:var(--ink)}.tabs button.on{background:var(--btn);color:#fff}
.total{background:var(--btn);color:#fff;border-radius:16px;padding:16px;font-size:1.3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .row button{padding:6px 12px;font-size:.85rem}
.card .row button:last-child{background:var(--chili)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid label{font-size:.8rem}
.kh{display:flex;justify-content:space-between;padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
#vscreen{align-items:center;text-align:center}
#blob{width:170px;height:170px;margin:40px auto 10px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd86b,var(--chili) 55%,var(--sky));filter:blur(2px);transition:transform .3s}
#blob.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18);border-radius:44% 56% 52% 48%}}
@media(prefers-reduced-motion:reduce){#blob.on{animation:none;transform:scale(1.1)}}
#vtext{min-height:3em;padding:0 10px}

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.bar,.inrow{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#f3ecdc;--paper:#16162a;--card:#232342;--line:#3a3a5c;--btn:#3d4290}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#f3ecdc;--paper:#16162a;--card:#232342;--line:#3a3a5c;--btn:#3d4290}

/* ---------- 3D buttons ---------- */
:root{--edge-btn:#0a0c1c;--edge-soft:#cdbf9d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--edge-btn:#20245c;--edge-soft:#12122a}}
:root[data-theme="dark"]{--edge-btn:#20245c;--edge-soft:#12122a}
button{--d:5px;--edge:var(--edge-btn);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 var(--d) 0 var(--edge),0 calc(var(--d) + 4px) 12px rgba(0,0,0,.22);transition:transform .08s ease,box-shadow .08s ease;-webkit-tap-highlight-color:transparent}
button::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to bottom,rgba(255,255,255,.3),rgba(255,255,255,0) 55%);pointer-events:none}
button:active{transform:translateY(4px);--d:1px}
button.sm{--d:3px}button.sm:active{transform:translateY(2px);--d:1px}
.pill,.back,.tabs button{--edge:var(--edge-soft)}
.tabs button.on{--edge:var(--edge-btn)}
.pill.gold{--edge:#b57d00}
.t1{--edge:#285a9f}.t2{--edge:#095453}.t3{--edge:#8f2234}
.tile{text-shadow:0 1px 1px rgba(0,0,0,.3)}
.card .row button:last-child{--edge:#8f2234}
.tabs,.row{padding-bottom:5px}
@media(prefers-reduced-motion:reduce){button{transition:none}}

/* ---------- Pro theme ---------- */
:root{--grad:linear-gradient(135deg,#2a2d7c 0%,#4a3fb0 55%,#7b52d6 100%);--shadow:0 8px 24px rgba(27,31,59,.10)}
body{font-family:"Poppins","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -8%,rgba(242,169,0,.22),transparent 65%),var(--paper)}
.screen.on{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.screen.on{animation:none}}
h1{font-size:2.1rem;font-weight:700;letter-spacing:-.5px}
input,select{border-radius:14px;padding:14px;box-shadow:inset 0 2px 4px rgba(0,0,0,.05)}input:focus,select:focus{border-color:var(--gold)}
.top.end{justify-content:flex-end}.spacer{flex:1}
.hero{text-align:center;padding:26px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero h2{font-weight:500;opacity:.8;font-size:1.05rem}
.logo{width:96px;height:96px;border-radius:28px;background:var(--grad);display:grid;place-items:center;font-size:3rem;box-shadow:0 14px 30px rgba(74,63,176,.35),inset 0 2px 0 rgba(255,255,255,.35)}
.logo.mid{width:72px;height:72px;font-size:2.2rem;border-radius:22px;align-self:center;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px 12px;font-size:.78rem;box-shadow:var(--shadow)}.chips b{font-weight:500}
.pill.big{padding:16px;font-size:1.1rem;font-weight:600}
.safe{font-size:.8rem}
.banner{background:var(--grad);color:#fff;margin:-18px -16px 6px;padding:22px 16px 20px;border-radius:0 0 28px 28px;box-shadow:0 12px 28px rgba(74,63,176,.3);display:flex;flex-direction:column;gap:14px}
.banner small{opacity:.8;font-size:.78rem;display:block}.banner h2{font-size:1.5rem;font-weight:700}
.glass{background:rgba(255,255,255,.2);--edge:rgba(0,0,0,.28);color:#fff}
.banner .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
.stat i{font-style:normal;font-size:1.3rem;display:block}.stat span{font-size:.75rem;opacity:.9}.stat b{font-weight:700}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;font-weight:600}
.tile i{font-style:normal;font-size:1.6rem;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tile span{flex:1}.tile em{font-style:normal;font-size:1.8rem;opacity:.8}
.t1{background:linear-gradient(135deg,#3a7bd5,#2b5fb8)}.t2{background:linear-gradient(135deg,#12a39b,#0b7371)}.t3{background:linear-gradient(135deg,#e0455d,#b92a42)}
.bar{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;border:0;border-radius:26px;padding:10px;box-shadow:0 10px 30px rgba(27,31,59,.22)}
.bar .pill{color:var(--ink)}.round{width:54px;padding:0;font-size:1.3rem;flex:none!important;text-align:center!important}
.inrow{border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(27,31,59,.10)}
.inrow button{background:var(--gold);color:#1b1f3b;--edge:#b57d00;font-weight:600}
.me{background:linear-gradient(135deg,#f6b800,#f29000);color:#1b1f3b;border-bottom-right-radius:4px}
.bot{border-bottom-left-radius:4px;box-shadow:var(--shadow)}.hint{opacity:.85;font-size:.88rem;border-style:dashed}
.tabs{background:var(--line);padding:5px;border-radius:16px;gap:4px}
.tabs button{background:transparent;color:var(--ink);box-shadow:none;border-radius:12px}.tabs button::after{display:none}.tabs button:active{transform:none}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.15);font-weight:600}
.total{background:var(--grad);border-radius:20px;font-weight:600;box-shadow:0 10px 24px rgba(74,63,176,.3)}
.card{border-radius:18px;box-shadow:var(--shadow)}.card b{font-size:1.05rem}
.chip{padding:2px 10px;border-radius:20px;font-weight:600;font-size:.85rem;width:fit-content}
.chip.up{background:rgba(20,160,140,.18);color:#0f9a86}.chip.down{background:rgba(209,52,75,.18);color:#e0455d}.chip.warn{background:rgba(242,169,0,.2);color:#c98a00}
.tsell{font-weight:600}
.empty{text-align:center;padding:40px 10px;opacity:.7}.empty i{display:block;font-style:normal;font-size:3rem}
.kh{border-radius:16px;box-shadow:var(--shadow);align-items:center;gap:12px}
.kh i{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.kh b{flex:1}.kh span{font-weight:700;color:var(--chili)}
#langs li{border-radius:12px;background:var(--card);margin-bottom:8px;border:1px solid var(--line)}#langs li.cur::after{content:" ✓"}
#blob{box-shadow:0 0 0 18px rgba(242,169,0,.12),0 0 0 40px rgba(209,52,75,.08),0 20px 60px rgba(58,123,213,.45)}
#vtext{font-size:1.05rem;white-space:pre-line}

.khc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.khc .kh{border:0;box-shadow:none;border-radius:0;background:transparent}
.khe{display:flex;justify-content:space-between;padding:8px 16px 8px 68px;font-size:.88rem;border-top:1px dashed var(--line)}.khe span:last-child{font-weight:600}

.vtype{display:flex;gap:8px;width:100%;margin-top:14px}.vtype button{background:var(--gold);color:#1b1f3b;--edge:#b57d00;font-weight:600}
#blob{cursor:pointer}
.khe{align-items:center;gap:8px}.khe span:nth-child(2){font-weight:600;margin-left:auto}.khe span.acts{font-weight:400;display:flex;margin-left:0}
button.mini{padding:4px 8px;font-size:.9rem;background:transparent;color:var(--ink);box-shadow:none;--d:0px}button.mini::after{display:none}button.mini:active{transform:none}
.khe.ed{padding-left:16px}.khe.ed input{padding:6px 8px;border-radius:10px;font-size:.85rem}

.msg{white-space:pre-line}

/* ---------- 3D Pro v3 ---------- */
:root{--hl:rgba(255,255,255,.65);--lift:0 1px 0 rgba(255,255,255,.7) inset,0 14px 22px -8px rgba(27,31,59,.22),0 3px 6px rgba(27,31,59,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:rgba(255,255,255,.07);--lift:0 1px 0 rgba(255,255,255,.08) inset,0 14px 22px -8px rgba(0,0,0,.6),0 3px 6px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#f3ecdc;--paper:#16162a;--card:#232342;--line:#3a3a5c;--btn:#3d4290;--hl:rgba(255,255,255,.07);--lift:0 1px 0 rgba(255,255,255,.08) inset,0 14px 22px -8px rgba(0,0,0,.6),0 3px 6px rgba(0,0,0,.35)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 320px at 92% 8%,rgba(123,82,214,.18),transparent 70%),radial-gradient(380px 300px at 4% 88%,rgba(18,163,155,.16),transparent 70%)}
.card,.khc,.chips span,#langs li,.msg.bot{box-shadow:var(--lift);background-image:linear-gradient(180deg,var(--hl),transparent 45%)}
.card:active,.khc:active{transform:translateY(1px)}
button{border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.18),0 var(--d) 0 var(--edge),0 calc(var(--d) + 6px) 14px rgba(0,0,0,.28)}
.tile,.pill.big{--d:7px}.tile:active,.pill.big:active{transform:translateY(6px)}
.tiles{gap:18px}
.tile i{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 rgba(0,0,0,.2)}
.chip{box-shadow:0 2px 0 rgba(0,0,0,.12)}
.me{box-shadow:0 3px 0 #c97b00,0 9px 14px rgba(0,0,0,.16)}
.logo{box-shadow:0 2px 0 #3a2f94,0 4px 0 #342a85,0 6px 0 #2d2476,0 8px 0 #261f68,0 24px 32px rgba(42,45,124,.45),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -8px 14px rgba(0,0,0,.22);text-shadow:0 4px 6px rgba(0,0,0,.3);animation:float 3.2s ease-in-out infinite}
.logo.mid{animation:none;box-shadow:0 2px 0 #3a2f94,0 4px 0 #342a85,0 6px 0 #2d2476,0 16px 22px rgba(42,45,124,.4),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -6px 10px rgba(0,0,0,.2)}
@keyframes float{50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
.banner{position:relative;overflow:hidden;box-shadow:0 18px 34px rgba(74,63,176,.38),inset 0 -4px 0 rgba(0,0,0,.14)}
.banner>*{position:relative;z-index:1}
.banner::before,.banner::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.banner::before{width:170px;height:170px;top:-60px;right:-40px}.banner::after{width:100px;height:100px;bottom:-40px;left:-20px}
.banner .stat{box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 12px 20px rgba(0,0,0,.2);backdrop-filter:blur(8px)}
.total{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.15),0 14px 26px rgba(74,63,176,.35)}
input,select{background-color:var(--card);box-shadow:inset 0 3px 6px rgba(27,31,59,.14),0 1px 0 rgba(255,255,255,.6)}
input:focus,select:focus{box-shadow:inset 0 3px 6px rgba(27,31,59,.1),0 0 0 4px rgba(242,169,0,.35)}
.bar{background:var(--card);backdrop-filter:blur(14px);box-shadow:0 18px 34px rgba(27,31,59,.28),inset 0 1px 0 var(--hl)}
.tabs{box-shadow:inset 0 3px 7px rgba(0,0,0,.16)}
.tabs button.on{box-shadow:0 4px 0 rgba(0,0,0,.14),0 8px 14px rgba(0,0,0,.14);transform:translateY(-1px)}
.kh i{box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.25)}
#blob{filter:none;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 22%),radial-gradient(circle at 35% 30%,#ffd86b,var(--chili) 55%,var(--sky));box-shadow:inset -16px -20px 34px rgba(0,0,0,.3),inset 8px 10px 18px rgba(255,255,255,.3),0 0 0 18px rgba(242,169,0,.12),0 0 0 40px rgba(209,52,75,.08),0 34px 50px rgba(58,123,213,.45)}

.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.ic.xl{width:1em;height:1em}
.logo .ic{stroke-width:1.5;color:#fff;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.chips span .ic{color:var(--teal)}
.glass .ic{width:1.35em;height:1.35em}.back .ic{width:1.2em;height:1.2em;vertical-align:middle}
.stat i .ic{width:1.3em;height:1.3em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.tile i .ic{width:1em;height:1em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}.tile em .ic{width:.7em;height:.7em}
.dock .ic{color:var(--teal)}.round .ic{width:1.4em;height:1.4em;color:var(--teal)}
.empty .ic{width:1em;height:1em;opacity:.5;stroke-width:1.5}
.khe .ic{width:1em;height:1em;opacity:.6}button.mini .ic{width:1.15em;height:1.15em}
.banner small .ic{width:1em;height:1em}
.screen>.top{position:sticky;top:0;z-index:5;margin:-18px -16px 0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--paper);background:color-mix(in srgb,var(--paper) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.stat b,.total,.khe,.kh span,.card,.chip,.tsell{font-variant-numeric:tabular-nums}
h2{letter-spacing:-.2px}.banner h2{font-size:1.6rem}
.stat b{font-size:1.7rem;letter-spacing:-.5px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.total{font-size:1.25rem;letter-spacing:-.2px}

.remind{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(242,169,0,.16);border:1px solid rgba(242,169,0,.5);font-size:.9rem;box-shadow:var(--lift)}
.remind[hidden]{display:none}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(242,169,0,.3);flex:none}
#remindtxt{flex:1;font-weight:500}
.vtip{font-size:.82rem;opacity:.75;text-align:center;padding:0 12px}
.vtype input{font-size:1rem;padding:16px}

[hidden]{display:none!important}
button{overflow:hidden}
button::before{content:"Dukaan Manager AI";position:absolute;right:10px;bottom:3px;font-size:.5rem;font-weight:600;letter-spacing:.4px;opacity:.3;white-space:nowrap;pointer-events:none}
.sm::before,.round::before,.back::before,.glass::before,.mini::before,.tabs button::before{display:none}
.glass.big{width:54px;height:54px;padding:0;border-radius:18px;display:grid;place-items:center}.glass.big .ic{width:1.7em;height:1.7em}
.regextra{display:flex;flex-direction:column;gap:12px}
.khm{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:.85rem;border-top:1px dashed var(--line);flex-wrap:wrap}
.khm.due{background:rgba(242,169,0,.14)}.khm .acts{margin-left:auto;display:flex}.khm .ic{width:1em;height:1em;opacity:.7}
.khm.ed input{padding:6px 8px;border-radius:10px;font-size:.85rem;flex:1;min-width:0}.khm.ed input[data-km=every]{flex:0 0 70px}
.kmsg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--lift)}
.kmsg textarea{font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical}
.kmsg .row{flex-wrap:wrap}.kmsg a.pill{flex:1;text-align:center;text-decoration:none;font-size:.95rem;padding:10px}

.netrow{display:flex;gap:10px}
.netrow span{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.netrow small{font-size:.72rem;opacity:.9}.netrow b{font-size:1rem;font-variant-numeric:tabular-nums}
.t4{background:linear-gradient(135deg,#f29000,#d97300);--edge:#9a5200}
.total{white-space:pre-line}
.khe .pay{color:#0f9a86}
.khm.ed input[type=time]{flex:0 0 108px}
.tour{position:fixed;inset:0;z-index:50;background:rgba(10,10,30,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.tourcard{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.tourico{width:84px;height:84px;border-radius:26px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #2d2476,0 16px 26px rgba(42,45,124,.4)}
.tourico .ic{width:42px;height:42px}
.tourcard p{opacity:.85;line-height:1.5}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold);width:22px;border-radius:6px}
.tourcard .row{width:100%;justify-content:space-between;margin-top:6px}.tourcard .row .pill{flex:1}

.toprow{display:flex;gap:12px;align-items:center}.toprow .tile{flex:1;min-width:0}
.vwrap{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;box-shadow:none;padding:0 0 4px;border-radius:12px;width:76px;flex:none;color:inherit;--d:0px;overflow:visible}
.vwrap::before,.vwrap::after{display:none}.vwrap:active{transform:none}
.vcirc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#1b1f3b;background:radial-gradient(circle at 32% 28%,#ffe08a,#f2a900 55%,#d98200);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 8px rgba(0,0,0,.18),0 6px 0 #9a5d00,0 12px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.vcirc .ic{width:30px;height:30px}
.vwrap:active .vcirc{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 1px 0 #9a5d00,0 3px 6px rgba(0,0,0,.25)}
.vlabel{font-size:.62rem;font-weight:700;line-height:1.15;text-align:center}
#remtoggle.off{background:var(--line);color:var(--ink);--edge:var(--edge-soft)}
</style>
</head>

    khArr(key).push({ id: Date.now(), date: today(), amount: -amt, pay: true }); persist(); renderDash();
    const left = khTotal(key);
    return t('khapaid').replace('{name}', key).replace('{amt}', r2(amt)).replace('{cur}', c) + '\n' + (left > 0 ? t('khaleft').replace('{amt}', left).replace('{cur}', c) : t('khaclear'));
  }
  if (r.intent === 'expense') {
    if (m === 'ask') return t('usesave');
    const amt = Number(r.amount), c = cur(); if (!(amt > 0)) return t('dunno');
    D.expenses = D.expenses || []; D.expenses.push({ id: Date.now(), date: today(), time: nowHM(), title: String(r.title || 'Kharcha').trim(), amount: amt }); persist(); renderDash();
    return t('expsaved').replace('{title}', String(r.title || 'Kharcha').trim()).replace('{amt}', r2(amt)).replace('{cur}', c) + '\n' + t('exptoday').replace('{amt}', expSum('daily', today())).replace('{cur}', c);
  }
  if (r.intent === 'sell' || r.intent === 'khata') {
    if (m === 'ask') return t('usesave');
    if (r.intent === 'khata') {
      const n = String(r.name || '?').trim(), key = Object.keys(D.khata).find(k => k.toLowerCase() === n.toLowerCase()) || n, c = cur();
      if (isNaN(Number(r.amount))) return t('dunno');
      khArr(key).push({ id: Date.now(), date: today(), amount: Number(r.amount) });
      const mm = kmeta(key), ph = cleanPhone(r.phone); if (ph) mm.phone = ph; if (Number(r.every) >= 1) mm.every = Math.round(Number(r.every));
      persist(); renderDash();
      return `${t('khadone')}: ${key} ${c}${khTotal(key)} · 📅 ${fmtDate(today())}` + (ph ? `\n📞 +91 ${ph}` : '') + (ph || Number(r.every) >= 1 ? `\n🔔 ${t('every').replace('{n}', mm.every)}` : '');
    }
    pending = null; listAsk = null;
    draft = { item: r.item ? String(r.item).trim() : null, qty: Number(r.qty) > 0 ? Number(r.qty) : null, sell: r.sell == null || isNaN(Number(r.sell)) ? null : Number(r.sell), buy: r.buy, buyType: r.buyType };
    return advance();
  }
  return r.answer || t('dunno');
}

async function send(m) {
  const inp = $('#in-' + m), text = inp.value.trim(); if (!text) return;
  const log = $('#log-' + m); inp.value = '';
  log.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}</div>`);
  const a = await handle(text, m);
  log.insertAdjacentHTML('beforeend', `<div class="msg bot">${esc(a)}</div>`); log.lastElementChild.scrollIntoView();
}

function speak(txt) {
  if (!window.speechSynthesis) return;
  const clean = txt.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, '').replace(/[₹\$€£د.إ৳]\s*([\d.]+)/g, '$1 ' + (S.lang === 'hi' ? 'रुपये' : ''));
  const u = new SpeechSynthesisUtterance(clean); u.lang = speechLang(); speechSynthesis.cancel(); speechSynthesis.speak(u);
}
async function runVoice(x) {
  $('#vtext').textContent = x + '\n…';
  const a = await handle(x, 'voice');
  $('#vtext').textContent = x + '\n' + a; speak(a);
}
let rec = null;
function listen() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return $('#vtext').textContent = t('unsup');
  if (rec) { try { rec.stop() } catch { } return }
  if (window.speechSynthesis) speechSynthesis.cancel();
  rec = new R(); rec.lang = speechLang(); rec.interimResults = true;
  let last = '';
  $('#blob').classList.add('on'); $('#mic span').textContent = t('listening'); $('#vtext').textContent = '';
  rec.onresult = e => { let txt = ''; for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript; last = txt; $('#vtext').textContent = txt };
  rec.onerror = e => { const blocked = e.error === 'not-allowed' || e.error === 'service-not-allowed'; $('#vtext').textContent = t(blocked ? 'micblock' : e.error === 'no-speech' ? 'nospeech' : 'micerr'); if (blocked) { const i = $('#in-voice'); if (i && i.focus) i.focus() } };
  rec.onend = () => { $('#blob').classList.remove('on'); $('#mic span').textContent = t('speak'); rec = null; if (last.trim()) runVoice(last.trim()) };
  try { rec.start() } catch { rec = null; $('#blob').classList.remove('on'); $('#vtext').textContent = t('micerr') }
}
function typeVoice() { const i = $('#in-voice'), x = i.value.trim(); if (!x) return; i.value = ''; runVoice(x) }

document.addEventListener('click', ev => {
  const el = ev.target.closest('button,li'); if (!el) return;
  if (el.hasAttribute('data-remind')) { show('typemsg'); postMissing(); return }
  if (el.dataset.go) return show(el.dataset.go);
  if (el.hasAttribute('data-back')) return back();
  if (el.dataset.auth) return openAuth(el.dataset.auth);
  if (el.dataset.report) { rmode = el.dataset.report; return show('report') }
  if (el.dataset.per) { period = el.dataset.per; return renderReport() }
  if (el.dataset.send) return send(el.dataset.send);
  if (el.dataset.l) { S.lang = el.dataset.l; meta(); applyLang(); if (S.user) back(); else back(); return }
  if (el.hasAttribute('data-due')) { show('khata'); return }
  if (el.dataset.eact) { const c = el.closest('.card'), id = c.dataset.eid; if (el.dataset.sure) { D.expenses = (D.expenses || []).filter(z => String(z.id) !== id); persist(); renderReport(); renderDash() } else { el.dataset.sure = 1; el.textContent = '✔' } return }
  if (el.dataset.kmact) {
    const row = el.closest('.khm'), n = row.dataset.n, ka = el.dataset.kmact;
    if (ka === 'edit') { row.outerHTML = khMeta(n, true); return }
    if (ka === 'save') { const m = kmeta(n), ev = Number(row.querySelector('[data-km=every]').value); m.phone = cleanPhone(row.querySelector('[data-km=phone]').value); if (ev >= 1) m.every = Math.round(ev); const tv = row.querySelector('[data-km=time]'); if (tv && tv.value) m.time = tv.value; persist(); renderKhata(); renderDash(); return }
    if (ka === 'send') { if (!kmeta(n).phone) { row.outerHTML = khMeta(n, true); return } openKmsg(n); return }
  }
  if (el.dataset.kact) {
    const row = el.closest('.khe'), n = row.dataset.n, arr = khArr(n), x = arr.find(z => String(z.id) === row.dataset.id), ka = el.dataset.kact;
    if (!x) return;
    if (ka === 'edit') row.outerHTML = khEdit(n, x);
    if (ka === 'del') { if (el.dataset.sure) { D.khata[n] = arr.filter(z => z !== x); if (!D.khata[n].length) delete D.khata[n]; persist(); renderKhata() } else { el.dataset.sure = 1; el.textContent = '✔' } }
    if (ka === 'save') { const am = Number(row.querySelector('[data-kf=amount]').value), dt = row.querySelector('[data-kf=date]').value; if (!isNaN(am)) x.amount = am; if (dt) x.date = dt; persist(); renderKhata() }
    return;
  }
  const c = el.closest('.card'), act = el.dataset.act;
  if (c && act) {
    const e = D.entries.find(z => z.id == c.dataset.id);
    if (act === 'edit') c.outerHTML = card(e, true);
    if (act === 'del') { if (el.dataset.sure) { D.entries = D.entries.filter(z => z !== e); persist(); renderReport() } else { el.dataset.sure = 1; el.textContent = '✔ ' + t('del') } }
    if (act === 'save') { c.querySelectorAll('[data-f]').forEach(i => { if (i.dataset.f !== 'pro' && i.value !== '') e[i.dataset.f] = Number(i.value); else if (i.dataset.f === 'buy') e.buy = null }); persist(); renderReport() }
  }
});
document.addEventListener('input', ev => {
  const c = ev.target.closest('.card'); if (!c) return;
  const v = f => c.querySelector(`[data-f=${f}]`).value, b = v('buy');
  c.querySelector('[data-f=pro]').value = b === '' ? '' : r2((Number(v('sell')) - Number(b)) * Number(v('qty')));
});
const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn) };
on('#lsearch', 'input', renderLangs);
on('#authgo', 'click', submitAuth);
on('#eye', 'click', () => $('#pass').type = $('#pass').type === 'password' ? 'text' : 'password');
on('#mic', 'click', listen);
on('#blob', 'click', listen);
on('#vsend', 'click', typeVoice);
on('#tourbtn', 'click', tourOpen);
on('#remtoggle', 'click', () => setRem(!remOn()));
on('#permyes', 'click', () => { D.prefs = Object.assign(D.prefs || {}, { remind: true }); persist(); $('#perm').hidden = true; renderDash(); renderKhata() });
on('#permno', 'click', () => { D.prefs = Object.assign(D.prefs || {}, { remind: false }); persist(); $('#perm').hidden = true; renderDash(); renderKhata() });
on('#tournext', 'click', tourNext);
on('#tourskip', 'click', tourClose);
on('#kmsgtxt', 'input', kmLinks);
on('#kmsgsms', 'click', markSent);
on('#kmsgwa', 'click', markSent);
on('#kmsgx', 'click', () => { $('#kmsgbox').hidden = true; kmsgFor = null });
on('#kmsgcopy', 'click', async () => { const tx = $('#kmsgtxt'); try { await navigator.clipboard.writeText(tx.value) } catch { tx.select(); try { document.execCommand('copy') } catch { } } $('#kmsgcopy').textContent = t('kcopied'); setTimeout(() => { $('#kmsgcopy').textContent = t('kcopy') }, 1500) });
on('#saveprof', 'click', () => { 
  const shop = $('#set-shop').value.trim(), ph = cleanPhone($('#set-phone').value), curSymbol = $('#set-currency').value; 
  if (!shop) return $('#profmsg').textContent = t('needshop'); 
  if (!ph) return $('#profmsg').textContent = t('needphone'); 
  D.profile = { shop, phone: ph }; 
  S.currency = curSymbol;
  meta(); persist(); 
  renderDash();
  $('#profmsg').textContent = t('saved'); 
});
on('#in-voice', 'keydown', e => { if (e.key === 'Enter') typeVoice() });
on('#rdate', 'change', renderReport);
on('#logout', 'click', () => { ['#log-type', '#log-ask'].forEach(q => { const l = $(q); if (l) l.querySelectorAll('.msg:not(.hint)').forEach(x => x.remove()) }); listAsk = null; S.user = null; meta(); D = { entries: [], khata: {} }; stack = ['home']; show('home', false) });
['type', 'ask'].forEach(m => on('#in-' + m, 'keydown', e => { if (e.key === 'Enter') send(m) }));

const missing = ['home', 'lang', 'auth', 'dash', 'typemsg', 'qbox', 'vscreen', 'report', 'khata', 'settings'].filter(id => !document.getElementById(id));
if (missing.length) document.body.insertAdjacentHTML('afterbegin', '<p style="background:#d1344b;color:#fff;padding:10px;margin:0">HTML panel mein ye sections nahi mile: ' + missing.join(', ') + '</p>');

let lastDay = today();
function dayTick() {
  const n = today(); if (n === lastDay) return;
  const r = $('#rdate'); if (r && r.value === lastDay) r.value = n;
  lastDay = n; renderDash(); postMissing();
  if ($('#report') && $('#report').classList.contains('on')) renderReport();
}
setInterval(dayTick, 30000);
document.addEventListener('visibilitychange', dayTick);
window.addEventListener('focus', dayTick);

applyLang();
if (S.user && load('dm_users', {})[S.user]) { D = load('dm_data_' + S.user, D); stack = ['dash']; show('dash', false); postMissing() }
setTimeout(() => { if (S.user && $('#tour').hidden) permCheck() }, 800);
</script>
